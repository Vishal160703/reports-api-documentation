
site_name: Reports API Documentation
site_description: API reference and usage documentation for the Reports REST API
site_url: https://vishal160703.github.io/reports-api-documentation/

repo_name: Vishal160703/reports-api-documentation
repo_url: https://github.com/Vishal160703/reports-api-documentation

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - API Reference:
      - List Reports: list-reports.md
      - Response Reference: response-reference.md
      - Error Reference: errors.md
  - About This Project: about.md

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
